# mypy settings for the pre-human-review quality gate (scripts/gate.sh).
# Author: Chakravardhan
#
# PROTECTED FILE -- see scripts/gate-ruff.toml. Existing errors are recorded
# per file and error code in scripts/gate-baseline.json.
[mypy]
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
show_error_codes = True
no_color_output = True
cache_dir = .gate/mypy-cache

# GPU-stack packages: huge, partially typed, and not what this gate is
# judging. Skipping them keeps results identical between a CPU runner and
# a developer machine with a different torch build.
[mypy-torch.*,torchaudio.*,nemo.*,omegaconf.*,numpy.*,scipy.*,soundfile.*]
follow_imports = skip
