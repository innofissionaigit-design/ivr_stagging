<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolkata Care AI — PCM transport</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 16px; background: #f4f6f8; }
    #micBtn { font-size: 18px; padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer; background: #007bff; color: white; }
    #micBtn.active { background: #dc3545; }
    #micBtn:disabled { background: #9aa4ad; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 14px; color: #555; min-height: 20px; }
    #status.speaking { color: #b45309; font-weight: 600; }
    #log { margin-top: 25px; white-space: pre-wrap; text-align: left; max-width: 600px; margin-inline: auto;
           background: white; padding: 15px; border-radius: 8px; max-height: 45vh; overflow-y: auto; }
    #warning { display: none; max-width: 600px; margin: 20px auto; background: #fff3cd; color: #664d03;
               padding: 12px; border-radius: 8px; font-size: 14px; }
    #note { max-width: 620px; margin: 14px auto 0; font-size: 12px; color: #6b7280; line-height: 1.6; }
    .badge { display: inline-block; background: #0f766e; color: white; font-size: 11px; padding: 3px 9px;
             border-radius: 999px; letter-spacing: .04em; vertical-align: middle; }
    #diag { max-width: 620px; margin: 10px auto 0; font-size: 11px; color: #94a3b8; font-family: ui-monospace, monospace; }
    #keypad { display: flex; flex-direction: column; gap: 8px; max-width: 340px; margin: 18px auto 0;
              background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 14px; }
    #keypad[hidden] { display: none; }
    #keypadHint { font-size: 13px; color: #9a3412; margin-bottom: 2px; }
    #keypad button { font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #fdba74;
                     background: white; cursor: pointer; text-align: left; }
    #keypad button:hover { background: #fff1e2; }
  </style>
</head>
<body>
  <h2>কলকাতা কেয়ার ডায়াগনস্টিকস <span class="badge">PCM</span></h2>
  <div id="warning"></div>
  <button id="micBtn">কল শুরু করুন (Start Call)</button>
  <div style="padding:6px 0">
    <label for="micSel" style="font-size:14px">মাইক্রোফোন / Microphone:&nbsp;</label>
    <select id="micSel" style="font-size:14px;padding:4px;max-width:100%"></select>
  </div>
  <div id="status">সিস্টেম প্রস্তুত...</div>
  <div id="diag"></div>

  <!-- Shown only when the server says so (a "_keypad" control frame, sent
       after two consecutive turns it could not make out). Hidden again the
       moment a spoken turn gets through, so it never becomes permanent
       furniture on the page. -->
  <div id="keypad" hidden>
    <div id="keypadHint">শোনা যাচ্ছে না — নিচ থেকে বেছে নিন:</div>
    <button data-digit="1">১ — পরীক্ষার রেট</button>
    <button data-digit="2">২ — ডাক্তারের সময়</button>
    <button data-digit="3">৩ — অ্যাপয়েন্টমেন্ট</button>
  </div>

  <div id="log"></div>
  <p id="note">
    AI বলার সময়েও আপনি বলতে পারেন — বললে AI থেমে যাবে। স্পিকারে থাকলেও কাজ করবে।
  </p>

  <script>
    const btn = document.getElementById('micBtn');
    const statusEl = document.getElementById('status');
    const diagEl = document.getElementById('diag');
    const log = document.getElementById('log');
    const warningEl = document.getElementById('warning');
    const keypadEl = document.getElementById('keypad');


    // ---- speakerphone support -------------------------------------------
    // The mic used to be muted for the whole of every reply, which made
    // barge-in impossible. It now stays live; the server tells its own echo
    // apart from the caller using the audio it just sent as a reference
    // (agent/echo_guard.py), and sends "_stop_audio" when the caller really
    // is talking over the agent.
    let currentSource = null;
    let bargedIn = false;

    function stopPlayback() {
      bargedIn = true;
      pendingClips = 0;
      try { currentSource && currentSource.stop(); } catch (e) { /* already ended */ }
      currentSource = null;
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'শুনছি...';
    }

    // Best-effort hint about how the caller is holding the phone. The server
    // treats it as a starting point only and lets its own Echo Return Loss
    // measurement override it -- getSettings() is inconsistent across
    // browsers and says nothing at all on most desktops.
    function detectAudioMode() {
      try {
        const track = stream && stream.getAudioTracks()[0];
        const label = (track && track.label || '').toLowerCase();
        if (/speaker|speakerphone|loud/.test(label)) return 'speakerphone';
        if (/headset|earpiece|handset|headphone/.test(label)) return 'handset';
      } catch (e) { /* label is privileged on some browsers */ }
      return null;
    }

    function showKeypad() { keypadEl.hidden = false; }
    function hideKeypad() { keypadEl.hidden = true; }

    // One listener on the container rather than three on the buttons: the
    // menu is server-defined and will grow.
    keypadEl.addEventListener('click', (e) => {
      const key = e.target.closest('button[data-digit]');
      if (!key || !inCall || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'dtmf', digit: key.dataset.digit }));
      hideKeypad();
    });

    const TARGET_RATE = 16000;   // what Silero VAD and IndicConformer both want
    const POST_PLAYBACK_GUARD_MS = 250;

    let ws, stream, captureCtx, playbackCtx, workletNode, sourceNode, sinkNode;
    let playQueue = Promise.resolve();
    let pendingClips = 0;
    let inCall = false;
    let bytesSent = 0;

    if (!window.AudioWorklet || !navigator.mediaDevices?.getUserMedia) {
      warningEl.style.display = 'block';
      warningEl.textContent =
        'এই ব্রাউজারে AudioWorklet সাপোর্টেড নয়। Chrome, Edge, বা Firefox ব্যবহার করুন।';
      btn.disabled = true;
    }

    function appendLog(sender, text) {
      const line = document.createElement('div');
      line.textContent = `[${sender}] ${text}`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    // enabled=false yields digital silence while keeping the track live, so
    // the worklet keeps emitting blocks and the server's sample timeline
    // advances at exactly real time. Stopping the node instead would make
    // recorded-time and wall-clock diverge and every processed_until_s
    // offset on the server would drift.
    function setMicMuted(muted) {
      if (!stream) return;
      stream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
    }

    function onPlaybackIdle() {
      if (pendingClips !== 0 || !inCall) return;
      setMicMuted(false);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'playback_done' }));
      }
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'শুনছি...';
    }

    function playAudio(arrayBuffer) {
      pendingClips += 1;
      bargedIn = false;
      statusEl.classList.add('speaking');
      statusEl.textContent = 'AI বলছে... (থামাতে বলুন)';

      playQueue = playQueue.then(() => new Promise(async (resolve) => {
        // Watchdog. The mic is muted EAGERLY above but only unmuted once this
        // promise settles, so anything that hangs here (a suspended context, a
        // decode that never returns, an onended that never fires) disables the
        // caller's microphone for the rest of the call. That failure is
        // invisible: audio keeps streaming, it is simply silent.
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        const watchdog = setTimeout(() => {
          console.warn('playback watchdog fired -- reopening mic anyway');
          finish();
        }, 15000);

        try {
          // Playback deliberately uses its OWN context at the device's
          // native rate. Decoding the 22.05kHz TTS WAV through the 16kHz
          // capture context would resample it down and throw away half the
          // voice quality we just spent effort improving.
          if (!playbackCtx) playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (playbackCtx.state === 'suspended') await playbackCtx.resume();
          const audioBuffer = await playbackCtx.decodeAudioData(arrayBuffer);
          if (bargedIn) { resolve(); return; }   // interrupted before this clip began
          const source = playbackCtx.createBufferSource();
          currentSource = source;
          source.buffer = audioBuffer;
          source.connect(playbackCtx.destination);
          source.onended = () => { clearTimeout(watchdog); finish(); };
          source.start();
        } catch (e) {
          console.error('audio decode failed', e);
          clearTimeout(watchdog);
          finish();
        }
      })).then(() => {
        // Clamped: stopPlayback() zeroes this while a clip's promise is
        // still in flight, and an unclamped decrement would leave the
        // counter permanently negative -- so the `=== 0` test below would
        // never match again and playback_done would never be sent for the
        // rest of the call.
        pendingClips = Math.max(0, pendingClips - 1);
        if (pendingClips === 0) setTimeout(onPlaybackIdle, POST_PLAYBACK_GUARD_MS);
      });
    }

    // Loopback / "what you hear" devices record the SPEAKERS, not the caller.
    // On Windows "Stereo Mix" is frequently the default input, which produces a
    // call of perfect silence that looks healthy from every other angle.
    const LOOPBACK_HINTS = ['stereo mix', 'what u hear', 'what you hear',
                            'wave out', 'loopback', 'mix output'];
    const isLoopback = (l) => LOOPBACK_HINTS.some((h) => (l || '').toLowerCase().includes(h));

    async function listMics(preselect) {
      const sel = document.getElementById('micSel');
      if (!sel) return;
      try {
        // NOTE (merge dev_chakravardhan -> staging_merged): dev_chakravardhan's
        // side of this conflict was a getUserMedia({...audioConstraints})
        // call that belongs in startCall() below, not here -- it never
        // defines `mics`, which the unconflicted tail of this function
        // (firstReal/preselect matching just below) depends on. That change
        // (autoGainControl: false) has been applied to startCall()'s own
        // audioConstraints instead, and this function keeps HEAD's real,
        // load-bearing loopback-sorting implementation intact.
        const mics = (await navigator.mediaDevices.enumerateDevices())
          .filter((d) => d.kind === 'audioinput');
        mics.sort((a, b) => (isLoopback(a.label) ? 1 : 0) - (isLoopback(b.label) ? 1 : 0));
        sel.innerHTML = '';
        mics.forEach((d, i) => {
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.textContent = (isLoopback(d.label) ? '[LOOPBACK - not a mic] ' : '') +
                          (d.label || `Microphone ${i + 1}`);
          sel.appendChild(o);
        });
        const firstReal = mics.findIndex((d) => !isLoopback(d.label));
        if (firstReal >= 0) sel.selectedIndex = firstReal;
        if (preselect) {
          const m = mics.findIndex((d) => d.label === preselect);
          if (m >= 0) sel.selectedIndex = m;
        }
      } catch (e) { console.warn('enumerateDevices failed', e); }
    }

    async function startCall() {
      // Create and unblock the playback context inside the user gesture --
      // browsers only honour resume() from a gesture, and creating it later
      // (from a WebSocket message) leaves it suspended forever.
      try {
        if (!playbackCtx) playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (playbackCtx.state === 'suspended') playbackCtx.resume();
      } catch (e) { console.warn('AudioContext init failed', e); }

      try {
        const chosen = document.getElementById('micSel')?.value;
        const audioConstraints = {
          // First stage of noise suppression, in the browser's own WebRTC
          // pipeline. A second, measurable stage runs server-side per clip
          // (agent/audio_quality.py) -- this one cannot be inspected or
          // tuned from here, and differs between browsers.
          channelCount: 1, echoCancellation: true, noiseSuppression: true,
          // ADDED BY CHAKRAVARDHAN -- autoGainControl explicitly OFF. AGC
          // rides the gain continuously, which lifts the noise floor during
          // the pauses between words -- the exact signal the turn detector
          // uses to decide the caller has finished. Levelling is done
          // instead as ONE constant gain per already-segmented clip on the
          // server, where it cannot move a turn boundary.
          autoGainControl: false,
        };
        // exact: never silently fall back to the browser default, which is how
        // a loopback device gets picked without anyone noticing.
        if (chosen) audioConstraints.deviceId = { exact: chosen };
        stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        await listMics(stream.getAudioTracks()[0].label);
      } catch (e) {
        statusEl.textContent = 'মাইক্রোফোন ব্লক করা আছে: ' + e.message;
        return;
      }

      // Ask for 16kHz directly so no resampling is needed anywhere. Browsers
      // are allowed to ignore this; the actual rate is reported to the
      // server in the hello frame and the server resamples if it differs,
      // rather than silently producing a wrong timeline.
      captureCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_RATE });
      if (captureCtx.state === 'suspended') await captureCtx.resume();

      try {
        await captureCtx.audioWorklet.addModule('pcm-worklet.js');
      } catch (e) {
        statusEl.textContent = 'অডিও মডিউল লোড হয়নি: ' + e.message;
        return;
      }

      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/audio`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'hello',
          sampleRate: captureCtx.sampleRate,
          format: 'pcm_s16le',
          channels: 1,
        }));

        sourceNode = captureCtx.createMediaStreamSource(stream);
        workletNode = new AudioWorkletNode(captureCtx, 'pcm-capture');
        workletNode.port.onmessage = (e) => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
            bytesSent += e.data.byteLength;
          }
        };

        // A worklet only runs while it is part of a live graph, so it has to
        // reach the destination -- but routing the microphone to the
        // speakers would create exactly the feedback loop this project
        // already fought. Gain 0 keeps the graph alive and silent.
        sinkNode = captureCtx.createGain();
        sinkNode.gain.value = 0;
        sourceNode.connect(workletNode);
        workletNode.connect(sinkNode);
        sinkNode.connect(captureCtx.destination);

        const mode = detectAudioMode();
        if (mode) ws.send(JSON.stringify({ type: 'audio_mode', mode }));

        inCall = true;
        pendingClips = 0;
        bytesSent = 0;
        btn.textContent = 'কল শেষ করুন (End Call)';
        btn.classList.add('active');
        statusEl.textContent = 'শুনছি...';
        diagEl.textContent = `transport: raw pcm_s16le @ ${captureCtx.sampleRate} Hz`;
      };

      ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
          const data = JSON.parse(event.data);
          if (data.sender === '_ping') return;
          if (data.sender === '_stop_audio') { stopPlayback(); return; }
          if (data.sender === '_keypad') { showKeypad(); return; }
          // A transcript came back, so speech is getting through again --
          // the keypad has served its purpose and should get out of the way.
          if (data.sender === 'User') hideKeypad();
          appendLog(data.sender, data.text);
        } else {
          playAudio(event.data);
        }
      };

      ws.onerror = () => { statusEl.textContent = 'সংযোগে সমস্যা হয়েছে।'; };
      ws.onclose = () => { if (inCall) endCall(); };
    }

    function endCall() {
      inCall = false;
      pendingClips = 0;
      setMicMuted(false);
      hideKeypad();
      try { sourceNode && sourceNode.disconnect(); } catch (e) { /* already torn down */ }
      try { workletNode && workletNode.disconnect(); } catch (e) { /* already torn down */ }
      try { sinkNode && sinkNode.disconnect(); } catch (e) { /* already torn down */ }
      if (captureCtx) { captureCtx.close(); captureCtx = null; }
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      btn.textContent = 'কল শুরু করুন (Start Call)';
      btn.classList.remove('active');
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'কল শেষ হয়েছে।';
      diagEl.textContent = `sent ${(bytesSent / 1024).toFixed(0)} KB raw PCM`;
    }

    btn.onclick = () => { inCall ? endCall() : startCall(); };

    // Device labels are only exposed after permission has been granted once,
    // so this is populated now and refreshed again after getUserMedia.
    listMics();
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', () => listMics());
    }
  </script>
</body>
</html>
