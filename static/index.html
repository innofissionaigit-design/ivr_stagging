<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolkata Care AI Voice Assistant</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 16px; background: #f4f6f8; }
    #micBtn { font-size: 18px; padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer; background: #007bff; color: white; }
    #micBtn.active { background: #dc3545; }
    #micBtn:disabled { background: #9aa4ad; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 14px; color: #555; min-height: 20px; }
    #status.speaking { color: #b45309; font-weight: 600; }
    #log { margin-top: 25px; white-space: pre-wrap; text-align: left; max-width: 600px; margin-inline: auto;
           background: white; padding: 15px; border-radius: 8px; max-height: 50vh; overflow-y: auto; }
    #warning { display: none; max-width: 600px; margin: 20px auto; background: #fff3cd; color: #664d03;
               padding: 12px; border-radius: 8px; font-size: 14px; }
    #note { max-width: 600px; margin: 14px auto 0; font-size: 12px; color: #6b7280; line-height: 1.5; }
    #keypad { display: flex; flex-direction: column; gap: 8px; max-width: 340px; margin: 18px auto 0;
              background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 14px; }
    #keypad[hidden] { display: none; }
    #keypadHint { font-size: 13px; color: #9a3412; margin-bottom: 2px; }
    #keypad button { font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #fdba74;
                     background: white; cursor: pointer; text-align: left; }
    #keypad button:hover { background: #fff1e2; }
  </style>
</head>
<body>
  <h2>কলকাতা কেয়ার ডায়াগনস্টিকস (Kolkata Care AI)</h2>
  <div id="warning"></div>
  <button id="micBtn">কল শুরু করুন (Start Call)</button>
  <!-- Explicit input picker. The browser default is not necessarily a
       microphone: on Windows it is often "Stereo Mix", a loopback device that
       records the speaker output rather than the mic, so the caller is
       recorded as perfect silence and nothing in the pipeline can tell why.
       Loopback devices are labelled and pushed to the bottom of this list. -->
  <div style="padding:6px 0">
    <label for="micSel" style="font-size:14px">মাইক্রোফোন / Microphone:&nbsp;</label>
    <select id="micSel" style="font-size:14px;padding:4px;max-width:100%"></select>
  </div>
  <div id="status">সিস্টেম প্রস্তুত...</div>
  <!-- Live capture readout. The server can only see that silence arrived, not
       WHY, so this shows the two things that distinguish the causes: whether
       the track is muted by the app, and the actual input level. -->
  <div id="diag" style="font-family:monospace;font-size:13px;padding:6px 0;color:#444"></div>

  <!-- Shown only when the server says so (a "_keypad" control frame, sent
       after two consecutive turns it could not make out). Hidden again the
       moment a spoken turn gets through, so it never becomes permanent
       furniture on the page. -->
  <div id="keypad" hidden>
    <div id="keypadHint">শোনা যাচ্ছে না — নিচ থেকে বেছে নিন:</div>
    <button data-digit="1">১ — পরীক্ষার রেট</button>
    <button data-digit="2">২ — ডাক্তারের সময়</button>
    <button data-digit="3">৩ — অ্যাপয়েন্টমেন্ট</button>
  </div>

  <div id="log"></div>
  <p id="note">
    AI বলার সময়েও আপনি বলতে পারেন — বললে AI থেমে যাবে। স্পিকারে থাকলেও কাজ করবে।
  </p>

  <script>
    const btn = document.getElementById('micBtn');
    const statusEl = document.getElementById('status');
    const log = document.getElementById('log');
    const warningEl = document.getElementById('warning');
    const keypadEl = document.getElementById('keypad');


    // ---- speakerphone support -------------------------------------------
    // The mic used to be muted for the whole of every reply, which made
    // barge-in impossible. It now stays live; the server tells its own echo
    // apart from the caller using the audio it just sent as a reference
    // (agent/echo_guard.py), and sends "_stop_audio" when the caller really
    // is talking over the agent.
    let currentSource = null;
    let bargedIn = false;

    function stopPlayback() {
      bargedIn = true;
      pendingClips = 0;
      try { currentSource && currentSource.stop(); } catch (e) { /* already ended */ }
      currentSource = null;
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'শুনছি...';
    }

    // Best-effort hint about how the caller is holding the phone. The server
    // treats it as a starting point only and lets its own Echo Return Loss
    // measurement override it -- track labels are inconsistent across
    // browsers and absent on most desktops.
    function detectAudioMode() {
      try {
        const track = stream && stream.getAudioTracks()[0];
        const label = (track && track.label || '').toLowerCase();
        if (/speaker|speakerphone|loud/.test(label)) return 'speakerphone';
        if (/headset|earpiece|handset|headphone/.test(label)) return 'handset';
      } catch (e) { /* label is privileged on some browsers */ }
      return null;
    }

    function showKeypad() { keypadEl.hidden = false; }
    function hideKeypad() { keypadEl.hidden = true; }

    // One listener on the container rather than three on the buttons: the
    // menu is server-defined and will grow.
    keypadEl.addEventListener('click', (e) => {
      const key = e.target.closest('button[data-digit]');
      if (!key || !inCall || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'dtmf', digit: key.dataset.digit }));
      hideKeypad();
    });

    const MIME_TYPE = 'audio/webm';

    // Delay between the last clip ending and the mic reopening. Speakers
    // and small rooms keep ringing for a moment after the waveform stops;
    // reopening on the exact sample boundary lets that tail back into the
    // buffer, which is the same self-hearing problem the mute exists to
    // solve, just smaller.
    const POST_PLAYBACK_GUARD_MS = 250;

    let ws, mediaRecorder, audioContext, stream;
    let playQueue = Promise.resolve();
    let pendingClips = 0;
    let inCall = false;
    let meterTimer = null;

    // Loopback / "what you hear" devices record the SPEAKERS, not the caller.
    // Selecting one produces a call of pure silence that looks healthy from
    // every other angle, so they are de-prioritised and labelled here.
    const LOOPBACK_HINTS = ['stereo mix', 'what u hear', 'what you hear',
                            'wave out', 'loopback', 'mix output'];
    const isLoopback = (label) =>
      LOOPBACK_HINTS.some((h) => (label || '').toLowerCase().includes(h));

    async function listMics(preselectLabel) {
      const sel = document.getElementById('micSel');
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter((d) => d.kind === 'audioinput');
        // Real microphones first; loopbacks last and marked.
        mics.sort((a, b) => (isLoopback(a.label) ? 1 : 0) - (isLoopback(b.label) ? 1 : 0));
        sel.innerHTML = '';
        mics.forEach((d, i) => {
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.textContent = (isLoopback(d.label) ? '[LOOPBACK - not a mic] ' : '') +
                          (d.label || `Microphone ${i + 1}`);
          sel.appendChild(o);
        });
        // Default to the first non-loopback entry.
        const firstReal = mics.findIndex((d) => !isLoopback(d.label));
        if (firstReal >= 0) sel.selectedIndex = firstReal;
        if (preselectLabel) {
          const match = mics.findIndex((d) => d.label === preselectLabel);
          if (match >= 0) sel.selectedIndex = match;
        }
      } catch (e) {
        console.warn('enumerateDevices failed', e);
      }
    }

    // Live capture meter. The server measured rms=0.00000 on 1.8 MB of
    // incoming audio -- real silence -- but silence has two very different
    // causes: the app disabling the track (setMicMuted), or the OS/device
    // capturing nothing. This reports both so they can be told apart.
    function startMeter(mediaStream) {
      const diagEl = document.getElementById('diag');
      try {
        const src = audioContext.createMediaStreamSource(mediaStream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        const buf = new Float32Array(analyser.fftSize);
        clearInterval(meterTimer);
        meterTimer = setInterval(() => {
          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
          const rms = Math.sqrt(sum / buf.length);
          const track = mediaStream.getAudioTracks()[0];
          const state = track ? (track.enabled ? 'ON ' : 'MUTED') : 'NONE';
          const bars = '#'.repeat(Math.min(30, Math.round(rms * 300)));
          diagEl.textContent =
            `mic:${state} level:${rms.toFixed(4)} ctx:${audioContext.state} ` +
            `clips:${pendingClips} device:${track ? track.label.slice(0, 28) : '-'} ${bars}`;
        }, 200);
      } catch (e) {
        diagEl.textContent = 'meter failed: ' + e.message;
      }
    }

    if (!('MediaRecorder' in window) || !MediaRecorder.isTypeSupported(MIME_TYPE)) {
      // Known, real limitation: Safari/iOS does not support MediaRecorder
      // with audio/webm at all. This bench client needs Chrome, Edge, or
      // Firefox until a WebM-free capture path is built for iOS callers.
      warningEl.style.display = 'block';
      warningEl.textContent =
        'এই ব্রাউজারে মাইক্রোফোন ক্যাপচার সাপোর্টেড নয় (Safari/iOS-এ কাজ করবে না)। Chrome, Edge, বা Firefox ব্যবহার করুন।';
      btn.disabled = true;
    }

    function appendLog(sender, text) {
      const line = document.createElement('div');
      line.textContent = `[${sender}] ${text}`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    // track.enabled = false, NOT mediaRecorder.pause(). The track keeps
    // producing frames (of digital silence), so the WebM timeline the
    // server slices utterances out of keeps advancing at real time.
    // Pausing the recorder would make recorded-time and wall-clock diverge,
    // and every processed_until_s offset on the server would drift.
    function setMicMuted(muted) {
      if (!stream) return;
      stream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
    }

    function onPlaybackIdle() {
      if (pendingClips !== 0 || !inCall) return;
      setMicMuted(false);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'playback_done' }));
      }
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'শুনছি...';
    }

    function playAudio(arrayBuffer) {
      pendingClips += 1;
      bargedIn = false;
      statusEl.classList.add('speaking');
      statusEl.textContent = 'AI বলছে... (থামাতে বলুন)';

      playQueue = playQueue.then(() => new Promise(async (resolve) => {
        // Watchdog. Muting the mic is done EAGERLY at the top of playAudio,
        // but unmuting only happens once this promise settles -- so anything
        // that can hang here (a suspended AudioContext, a decode that never
        // returns, an onended that never fires) silently disables the
        // caller's microphone for the rest of the call. That failure is
        // invisible from the client: audio keeps streaming to the server,
        // it is just silent. A hard ceiling guarantees the mic comes back.
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        const watchdog = setTimeout(() => {
          console.warn('playback watchdog fired -- reopening mic anyway');
          finish();
        }, 15000);

        try {
          if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          if (bargedIn) { resolve(); return; }   // interrupted before this clip began
          const source = audioContext.createBufferSource();
          currentSource = source;
          source.buffer = audioBuffer;
          source.connect(audioContext.destination);
          source.onended = () => { clearTimeout(watchdog); finish(); };
          source.start();
        } catch (e) {
          console.error('audio decode failed', e);
          clearTimeout(watchdog);
          finish();
        }
      })).then(() => {
        // Clamped: stopPlayback() zeroes this while a clip's promise is
        // still in flight, and an unclamped decrement would leave the
        // counter permanently negative -- so the `=== 0` test below would
        // never match again and playback_done would never be sent for the
        // rest of the call.
        pendingClips = Math.max(0, pendingClips - 1);
        // Only the LAST clip in a burst reopens the mic -- otherwise the
        // gap between two queued replies would unmute mid-sentence.
        if (pendingClips === 0) setTimeout(onPlaybackIdle, POST_PLAYBACK_GUARD_MS);
      });
    }

    async function startCall() {
      // Create and unblock the AudioContext HERE, synchronously inside the
      // click handler, before the first await. Browsers only honour
      // resume() when it is reached from a user gesture; creating the
      // context later -- inside playAudio, which runs from a WebSocket
      // message -- leaves it "suspended" and the resume() there can never
      // settle. That hung the playback promise, so onPlaybackIdle() never
      // ran, so the mic setMicMuted(true) had disabled at the start of the
      // greeting was NEVER re-enabled. The caller then spoke into a dead
      // track for the rest of the call: the server received the audio, but
      // it was pure silence, so no turn was ever detected.
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
      } catch (e) {
        console.warn('AudioContext init failed', e);
      }

      try {
        const chosen = document.getElementById('micSel').value;
        const audioConstraints = {
          // First stage of noise suppression, in the browser's own WebRTC
          // pipeline. A second, measurable stage runs server-side per clip
          // (agent/audio_quality.py) -- this one cannot be inspected or
          // tuned from here, and differs between browsers.
          channelCount: 1, echoCancellation: true, noiseSuppression: true,
          // ADDED BY CHAKRAVARDHAN -- autoGainControl explicitly OFF. AGC
          // rides the gain continuously, which lifts the noise floor during
          // the pauses between words -- the exact signal the turn detector
          // uses to decide the caller has finished. Levelling is done
          // instead as ONE constant gain per already-segmented clip on the
          // server, where it cannot move a turn boundary.
          autoGainControl: false,
        };
        // exact: refuse to silently fall back to the browser default, which is
        // how a loopback device gets selected without anyone noticing.
        if (chosen) audioConstraints.deviceId = { exact: chosen };
        stream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        await listMics(stream.getAudioTracks()[0].label);
      } catch (e) {
        statusEl.textContent = 'মাইক্রোফোন ব্লক করা আছে: ' + e.message;
        return;
      }

      startMeter(stream);

      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/audio`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        mediaRecorder = new MediaRecorder(stream, { mimeType: MIME_TYPE });
        // Continuous small chunks -- the server-side turn detector decides
        // when an utterance is complete, not this button. See main.py's
        // TurnDetector: the mic stays open for the whole call, like a real
        // phone line, not a single push-to-talk press.
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
            e.data.arrayBuffer().then((buf) => ws.send(buf));
          }
        };
        mediaRecorder.start(250);
        const mode = detectAudioMode();
        if (mode) ws.send(JSON.stringify({ type: 'audio_mode', mode }));

        inCall = true;
        pendingClips = 0;
        btn.textContent = 'কল শেষ করুন (End Call)';
        btn.classList.add('active');
        statusEl.textContent = 'শুনছি...';
      };

      ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
          const data = JSON.parse(event.data);
          if (data.sender === '_ping') return; // keepalive, not a real exchange
          if (data.sender === '_stop_audio') { stopPlayback(); return; }
          if (data.sender === '_keypad') { showKeypad(); return; }
          // A transcript came back, so speech is getting through again --
          // the keypad has served its purpose and should get out of the way.
          if (data.sender === 'User') hideKeypad();
          appendLog(data.sender, data.text);
        } else {
          playAudio(event.data);
        }
      };

      ws.onerror = () => { statusEl.textContent = 'সংযোগে সমস্যা হয়েছে।'; };
      ws.onclose = () => { if (inCall) endCall(); };
    }

    function endCall() {
      inCall = false;
      pendingClips = 0;
      setMicMuted(false);
      hideKeypad();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      btn.textContent = 'কল শুরু করুন (Start Call)';
      btn.classList.remove('active');
      statusEl.classList.remove('speaking');
      statusEl.textContent = 'কল শেষ হয়েছে।';
    }

    btn.onclick = () => { inCall ? endCall() : startCall(); };

    // Populate the picker on load. Labels are only exposed after permission
    // has been granted once, so this is refreshed again after getUserMedia.
    listMics();
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', () => listMics());
    }
  </script>
</body>
</html>
